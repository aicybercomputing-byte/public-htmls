var EVENTS_CSV = "confirm_deny,url,title,detail,location,speaker,bio,start_date,start_time,end_date,end_time,source_type\r\nConfirmed,,Reasoning Guardrails for the Agentic Web,\"Large language models are shifting from text predictors to agents that operate on the web and within software systems. This transition amplifies safety risks across dialogue, the environments agents control, and compliance with real-world policies. This talk presents ThinkGuard, a reasoning-based guardrail trained via mission-focused distillation to acquire deliberative thinking without costly manual annotation. By reasoning over goals, constraints, and latent hazards, ThinkGuard generalizes to implicit, complex, and previously unseen risks. I will also outline guardrail extensions that enforce policy compliance for web and system agents, and omnimodal guardrails that vet and steer interactions involving images, audio, and video. Together, these techniques transform guardrails from brittle filters into adaptive, explanatory safety layers that preserve utility while measurably reducing failure in agentic workflows.\",,Muhao Chen,\"Muhao Chen is an Assistant Professor at the Department of Computer Science, UC Davis, where he leads the Language Understanding and Knowledge Acquisition (LUKA) Group. He received his Ph.D. from the Department of Computer Science at UCLA, and B.S. in Computer Science from Fudan University. His research focuses on robust and accountable ML, particularly on accountability and security issues of large language models and agentic AI. He serves several organizational roles within the Association for Computational Linguistics (ACL), and has organized a number of tutorials and workshops at leading NLP and AI conferences. His work has been recognized with EMNLP Outstanding Paper Awards (2023, 2024), an ACM SIGBio Best Student Paper Award (2020), faculty research awards from Amazon (2022, 2023) and Cisco, and funding support from multiple NSF, DARPA, IARPA, and industry grants.\",2026-01-23,,2026-01-23,,ai-x\r\nConfirmed,,,\"Despite rapid advances in artificial intelligence, many clinical AI models fail to achieve real-world healthcare impact. The primary barrier is often not model performance, but misalignment between AI methods, clinically meaningful questions, and access to appropriate real-world data. This talk presents a practical roadmap for computer science and engineering investigators interested in conducting high-impact clinical AI research at scale. We introduce a structured evidence-gap discovery framework that combines systematic reviews and clinical practice guidelines with AI-assisted extraction and human validation to identify clinically important, measurable, and fundable research questions. These gaps are then mapped to appropriate AI tasks\u00ef\u00bf\u00bdincluding prediction, natural language processing, computer vision, and multimodal modeling\u00ef\u00bf\u00bdand to real-world clinical, administrative, registry, and social determinant datasets. The session also reviews realistic data access pathways, governance considerations, and collaboration models. Attendees will leave with a concrete framework for moving from idea to dataset to fundable clinical AI study, grounded in real-world clinical needs and data constraints.\",,Ricardo Pietrobon,\"Ricardo Pietrobon, MD, PhD, MBA\u00ef\u00bf\u00bdis the CEO of SporeData Inc. and a physician-scientist with deep expertise in clinical research, real-world data, and large-scale health analytics. Trained in medicine, epidemiology, biomedical informatics, and business, he previously held senior academic and leadership roles at Duke University, where he served as Director of Biomedical Informatics for the Duke Center for Translational Sciences Award (CTSA). Dr. Pietrobon has authored hundreds of peer-reviewed publications spanning clinical epidemiology, health services research, informatics, and research methodology. His current work focuses on enabling clinically meaningful AI by aligning advanced analytic methods with real-world healthcare data, evidence gaps, governance models, and fundable research pathways. He works closely with academic investigators to translate AI innovation into scalable, clinically relevant impact.\u00ef\u00bf\u00bd\u00ef\u00bf\u00bd\",2026-02-06,,2026-02-06,,ai-x\r\nConfirmed,,Advancing Controllable Image Generation with Consistency and Preference Optimization,\"This presentation will explore recent advances in controllable image generation using diffusion models, with a focus on achieving precise alignment between generated images and structured visual conditions such as segmentation masks, edges, depth maps, and human poses. The talk will begin by outlining the limitations of existing conditional diffusion methods, which often lack explicit objectives to enforce fine-grained controllability. I will then introduce two recent approaches that address this challenge through consistency- and preference-based learning. The first leverages pixel-level cycle consistency and efficient reward fine-tuning to strengthen adherence to input controls without incurring the high computational cost of full diffusion backpropagation. The second reformulates controllable generation as a condition-level preference optimization problem, enabling robust optimization across all diffusion timesteps. Together, these methods demonstrate significant improvements in controllability while preserving image quality, highlighting new directions for reliable and scalable control in generative vision models.\",,Chen Chen,\"Dr. Chen Chen is an Associate Professor at the Center for Research in Computer Vision (CRCV) and the Institute of Artificial Intelligence at the University of Central Florida. He received his Ph.D. in Electrical Engineering from The University of Texas at Dallas in 2016, where he was awarded the David Daniel Fellowship for Best Doctoral Dissertation. His research interests span computer vision, controllable and efficient generative models, multimodal and federated learning, and medical and healthcare AI. He has led and participated in numerous federally and industry sponsored research projects supported by NSF, USDA, IARPA, and industry partners, with a focus on scalable, resource-efficient visual intelligence systems. Dr. Chen serves as an Associate Editor for IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI) and IEEE Transactions on Circuits and Systems for Video Technology (T-CSVT), and has served as an Area Chair for major conferences including ICCV, NeurIPS, ECCV, CVPR, ACM Multimedia, and ICME. He has published extensively, with over 30,000 citations and an h-index of 83 according to Google Scholar\",2026-02-13,,2026-02-13,,ai-x\r\nConfirmed,,\"Geospatial Understanding of Foundation Models: Self-Supervision, Robustness, and Resource-Constrained Learning\",\"Large-scale geospatial understanding from satellite imagery remains less mature than natural-image vision. Current practice often relies on narrow, task-specific pipelines, and there is limited work on truly task-agnostic foundation models that remain robust under domain shift, geographic variation, and diverse real-world scenes. We advance remote-sensing foundation-model development and evaluation along three axes. First, we build self-supervised multispectral models for satellite image classification by adapting common SSL methods (BYOL, Barlow Twins, DINO, MoCo, SimSiam) to multispectral inputs. We pretrain on EuroSAT and BigEarthNet and evaluate cross-dataset transfer. The resulting multispectral checkpoints, especially those trained on BigEarthNet achieve strong transfer despite using only a fraction of the data typically used in ImageNet-scale training. Second, we benchmark eight ViT-based geospatial foundation models (including SatMAE/Scale-MAE/Cross-Scale MAE, the Geospatial Foundation Model, and supervised multi-task pretraining) via end-to-end fine-tuning on four downstream tasks: classification, segmentation, oriented object detection, and change detection. Performance is highly task-dependent: models are competitive for classification and segmentation but underperform for change detection and oriented detection, and cross-dataset generalization degrades when imagery comes from different satellites. Across experiments, pretraining data quality (spatial resolution and scene diversity) matters more than dataset size, and scaling from ViT-Base to ViT-Large yields ~1% gains. Finally, we introduce Hierarchical Attention Distillation (HAD) to transfer multi-scale spatial and semantic representations from a large teacher to a compact student using unlabeled data, reducing parameters to less than 5% of state-of-the-art solutions while retaining competitive performance.\",,Gilbert Rotich,,2026-02-20,,2026-02-20,,ai-x\r\nConfirmed,,Understanding How Children and Adults Interact with Virtual Objects in Augmented Reality Headsets,\"Current augmented reality (AR) headset applications often rely on predefined gesture sets that fail to align with users' natural expectations, leading to unintuitive experiences. To address this gap, we conducted two separate open-ended elicitation studies with 30 adults and 20 children (ages 9-12). Participants were tasked with replicating 17 different actions (e.g., moving, rotating) on a 3D virtual cube using any interaction modality they preferred.\u00ef\u00bf\u00bdOur findings reveal critical differences and similarities across both participant groups. Adults predominantly default to direct hand manipulation (comprising 82%\u00ef\u00bf\u00bdof first choices) , but demonstrate a strong preference for interaction flexibility, with 52%\u00ef\u00bf\u00bdof secondary proposals switching to a different modality. Their mental models are largely grounded in real-world experiences, naive physics, and pop culture. Conversely, children expect to engage their entire bodies (e.g., kicking, running) and frequently incorporate external physical or imagined objects as tools. Furthermore, children distinctively construct narratives around their interactions to contextualize abstract tasks. By comparing these distinct mental models, this talk highlights the necessity of moving beyond static, unimodal gesture sets. We will discuss actionable design recommendations for future AR headset applications, emphasizing the need for multimodal flexibility, whole-body tracking, and physics-aware virtual environments to accommodate the diverse, intuitive expectations of all users.\",,Alejandro,,2026-03-13,,2026-03-13,,ai-x\r\nConfirmed,,Simulating Impaired Speech Dialogue: A Preclinical Testbed for Conversational AI in Communication Disorders,\"Conversational artificial intelligence (C-AI) has the potential to scale speech-language therapy, yet current systems often fail when exposed to the variability and error patterns characteristic of disordered speech. This reflects a key limitation in the clinical development pipeline, where AI systems are evaluated under idealized conditions without preclinical testing in realistic impairment-rich communicative contexts. This talk introduces Agent-Based Conversational Dialogue (ABCD), a simulation-based framework that models impaired speech dialogue as a preclinical testbed for conversational AI in communication disorders. ABCD integrates agent-based modeling with large language models to simulate dynamic, multi-turn interactions between a virtual patient agent with communication disorders (e.g., aphasia) and a virtual clinician. This enables rapid, large-scale testing of AI systems without requiring human participants. Using this framework, two studies are presented. Study 1 demonstrates feasibility, showing that AI clinicians maintain high coherence and therapeutic appropriateness despite errorful input. Study 2 demonstrates that response accessibility is a tunable parameter influenced by prompting strategies, model architecture, and reasoning mode. Beyond evaluation, ABCD enables generation of synthetic disordered speech data by parameterizing linguistic error types, severity levels, and multimodal perturbations. These datasets may support robust, inclusive AI training. Together, ABCD establishes a scalable, simulation-first paradigm for developing safe and clinically effective conversational AI.\",,Gerald C. Imaezue,,2026-03-27,,2026-03-27,,ai-x\r\nConfirmed,,Improving Assertion-Based Hardware Verification with Semantic Alignment Checking using Large Language Models,\"Large language models (LLMs) are increasingly being integrated into hardware design verification workflows, particularly for SystemVerilog Assertion (SVA) generation. However, existing approaches primarily emphasize syntactic correctness and formal verification for evaluation, while the semantic alignment between generated assertions and natural language design specifications remains difficult to quantify and ensure. This gap introduces risks of hallucinated or vacuous assertions, reducing confidence and increasing debugging effort, especially in the absence of golden RTL. Bridging this gap requires a method that enforces semantic alignment throughout the generation process rather than a post-generation step.\u00ef\u00bf\u00bdThis talk will begin with a review of the current state of the art SVA generation methodologies and their limitations. To address these challenges, we present SpecAlign, a framework for evaluating and refining LLM-generated SVAs with a novel approach that explicitly enforces semantic alignment between assertions and the specification. SpecAlign iteratively refines and provides evidence for natural language properties and SVAs with the goal of improving consistency, explainability, and confidence. This is achieved with two evidence- and reasoning-based loops that classify properties and SVAs based on semantic alignment and generate structured feedback and evidence. Additionally, SpecAlign provides a quantitative alignment score to measure semantic alignment across iterations, providing an alternative to traditional evaluation methods that rely on formal verification and golden RTL. The talk concludes with a discussion of future research directions in LLM-based SVA generation and the broader role of LLMs in hardware verification.\",,Jaime Imperial,,2026-04-10,,2026-04-10,,ai-x\r\nConfirmed,,Active Perception in Dynamic and Unknown Environment,\"Sensing is a crucial component of autonomous systems, providing the necessary information to interact with and understand the environment. However, environmental conditions often limit the effectiveness of sensing capabilities, making perception inherently uncertain. This talk will address the challenges of underwater sensing and perception, emphasizing the need for autonomous systems to manage uncertainties arising from dynamic and unknown environments. Drawing from lessons learned in a previous project on underwater object recognition, I will discuss the role of planning algorithms in active sensing to reduce perception uncertainties. I will also introduce ongoing research efforts that integrate planning and perception, focusing on how these methods can enhance the performance of autonomous systems in challenging underwater settings.\",,Jane Sine,\"Jane Shin is an Assistant Professor in the Mechanical and Aerospace Engineering Department at the University of Florida. She received her M.S. and Ph.D. in Mechanical Engineering from Cornell University and a B.S. in Naval Architecture and Ocean Engineering from Seoul National University. During her Ph.D., she was selected as a Commercialization Fellow at Cornell in 2020. She was selected as one of IEEE Oceanic Engineering Society YP-Boost Laureates in 2025. Her expertise lies in autonomous systems, robotics, and active perception, where she focuses on addressing the uncertainties in perception caused by challenging environmental conditions.\",2026-04-17,,2026-04-17,,ai-x\r\nConfirmed,,From Scaling to Safety: How Test-Time Compute Introduces a New Attack Surface in LLMs,\"Large Language Models (LLMs) are a key part of modern artificial intelligence, used in tasks ranging from complex reasoning to everyday interactions. As demand for better performance grows, they are made smarter through scaling, using more data, larger models, and more recently, Test-Time Scaling (TTS). TTS uses extra compute at inference time to generate better responses. While this improves output quality and reasoning, its safety risks are still not well understood. In this talk, I will explain how LLMs work, how scaling improves them, and why these improvements can also introduce new risks. I will begin with an overview of LLMs and scaling methods, focusing on TTS approaches such as Best-of-N. These methods can be understood through three main components: how responses are generated, how they are scored, and how much computation is used. Next, I will connect traditional adversarial attacks on LLMs to new risks introduced by TTS. I will then present our work, \u00ef\u00bf\u00bdLess Diverse, Less Safe\u00ef\u00bf\u00bd, which identifies a new failure mode related to diversity in generated responses. I will show that this safety concern arises across different TTS methods and models and demonstrate that the threat can be transferred to closed-source systems and can bypass strong safety guardrails. I conclude by highlighting the need for safety-aware TTS design as an important step toward building safer and more reliable AI systems.\",,Shahriar Kabir Nahin,,2026-04-24,,2026-04-24,,ai-x\r\nConfirmed,,Curvature-Weighted Capacity Allocation: A Minimum Description Length Framework for Layer-Adaptive Large Language Model Optimization,\"As large language models scale to trillions of parameters, hardware constraints on memory and compute become severe physical bottlenecks. A key driver of this inefficiency is that neural network layers are not created equal: some layers do the heavy lifting to reduce errors, while others are nearly redundant. Existing methods attempt to manage this, but they rely on gradient-based trial-and-error heuristics that ignore the local \"\"curvature\"\" of the learning landscape. These heuristics offer no guarantees and are computationally expensive, leading to a suboptimal distribution of resources and performance. To solve this, we take inspiration from information theory, especially the Minimum Description Length principle, to design a framework that acts as a mathematically rigorous budget manager for LLMs and any other AI models. By calculating a curvature-adjusted score for each layer, our system assesses a layer's true reducible risk and its actual potential to improve the model. It then uses a single convex optimization program to automatically drive two capacity allocation decisions: allocating extra computing capacity to the high-performing layers or pruning away wasted parameters from the low-performing ones. Tested on models like Mistral-7B and Gemma-7B, with benchmarks which include CoLA, MRPC, CommonsenseQA, etc. This budget-feasible approach replaces empirical guesswork with provable optimization guarantees, maximizing efficiency strictly within a global hardware limit.\",ENG 4,Theophilus Amaefuna,Theophilus is a Fourth-year PhD student from the Trustworthy Knowledge-Driven AI (TKAI) Lab. My work focuses on Predictive Coding models and Verifiable Large Language Models on formal languages.,2026-09-18 00:00:00,13:00:00,2026-09-18 00:00:00,1:50pm,ai-x\r\nConfirmed,,Revisiting the Effectiveness of LLM Pruning for Test-Time Scaling,\"Large Language Models (LLMs) now exhibit remarkable growth in reasoning capabilities through test-time scaling (TTS). TTS uses additional compute during inference by generating thinking tokens. While TTS has significantly enhanced the reasoning capabilities of LLMs, these improvements come at the cost of increased inference time and computational demands. Model pruning provides a promising way to reduce these computational requirements by removing redundant parameters from the model. However, previous work has shown that naively pruning reasoning models can lead to severe degradation in performance. In this talk, I will show that, unlike structured pruning approaches that past work has explored in the context of reasoning and TTS, unstructured pruning methods can retain reasoning performance comparable to the full model, and at times even exceeding it. I will conclude by discussing what these findings reveal about reasoning models and their broader implications for building more efficient AI systems without sacrificing capability.\",ENG 4,Ocean Monjour,\"Ocean Monjur is a 1st year PhD student in the Bellini College of Artificial Intelligence, Cybersecurity and Computing at the University of South Florida. He is part of the PALM Lab led by Dr. Anshuman Chhabra. His research focuses on improving the interpretability and robustness of agentic systems and large language models (LLMs).\",2026-09-25 00:00:00,13:00:00,2026-09-25 00:00:00,1:50pm,ai-x\r\n";

(function () {
  "use strict";

  var ROOT = document.getElementById("aix-past-events");
  var ALL_URL      = ROOT.getAttribute("data-all-events-url") || "#";
  var VISIBLE      = parseInt(ROOT.getAttribute("data-visible"), 10) || 5;
  var YEAR         = parseInt(ROOT.getAttribute("data-year"), 10) || 2026;

  var HEAD = "'Barlow Condensed','Arial Narrow',Arial,sans-serif";
  var BODY = "'Open Sans',Arial,Helvetica,sans-serif";
  var GREEN = "#006747", TEAL = "#009374", GOLD = "#cfc493", SLATE = "#466069", GRAY = "#7E96A0";

  var MONTHS = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  var MONTH_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  var events = [];          // parsed + filtered + sorted
  var view = "list";        // "list" | "detail"
  var selectedId = null;

  /* ---------- tiny DOM helper (all styling stays inline) ---------- */
  function el(tag, style, opts) {
    var e = document.createElement(tag);
    if (style) e.style.cssText = style;
    if (opts) {
      if (opts.text != null) e.textContent = opts.text;
      if (opts.html != null) e.innerHTML = opts.html;
      if (opts.attrs) for (var k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
      if (opts.on) for (var ev in opts.on) e.addEventListener(ev, opts.on[ev]);
    }
    return e;
  }

  function hover(node, onBg, offBg) {
    node.addEventListener("mouseenter", function () { node.style.background = onBg; });
    node.addEventListener("mouseleave", function () { node.style.background = offBg; });
  }

  /* ---------- CSV parsing ---------- */
  function parseCSV(text) {
    var rows = [], field = "", row = [], inQ = false;
    text = text.replace(/^\uFEFF/, "");
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQ = false;
          }
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQ = true;
      } else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\r") {
        /* skip */
      } else if (c === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else {
        field += c;
      }
    }
    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  function clean(s) {
    return (s == null ? "" : String(s)).replace(/\uFFFD/g, "\u2014").trim();
  }

  function parseDate(startDateRaw, endDateRaw) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(clean(startDateRaw));
    if (!m) return null;

    var yearNum = parseInt(m[1], 10);
    var mi = parseInt(m[2], 10) - 1;
    var dayNum = parseInt(m[3], 10);

    if (mi < 0 || mi > 11 || !dayNum) return null;

    var endDateStr = clean(endDateRaw);
    var isRange = !!endDateStr && endDateStr !== clean(startDateRaw);

    return {
      day: String(dayNum).length < 2 ? "0" + dayNum : String(dayNum),
      mon: MONTH_FULL[mi].slice(0, 3),
      year: String(yearNum),
      label: MONTH_FULL[mi] + " " + dayNum + ", " + yearNum,
      isRange: isRange,
      endDateStr: endDateStr,
      sortKey: new Date(yearNum, mi, dayNum).getTime()
    };
  }

  function buildEvents(text) {
    var rows = parseCSV(text);
    if (!rows.length) return [];

    var header = rows[0].map(function (h) { return clean(h).toLowerCase(); });
    function colIndex(name) { return header.indexOf(name); }

    var idxTitle = colIndex("title"),
        idxDetail = colIndex("detail"),
        idxStartDate = colIndex("start_date"),
        idxEndDate = colIndex("end_date"),
        idxStartTime = colIndex("start_time"),
        idxEndTime = colIndex("end_time"),
        idxSpeaker = colIndex("speaker"),
        idxBio = colIndex("bio"),
        idxLocation = colIndex("location"),
        idxConfirmDeny = colIndex("confirm_deny");

    var out = [];
    rows.slice(1).forEach(function (cols, idx) {
      var speaker = clean(cols[idxSpeaker]),
          title = clean(cols[idxTitle]),
          description = clean(cols[idxDetail]),
          bio = clean(cols[idxBio]),
          location = idxLocation >= 0 ? clean(cols[idxLocation]) : "",
          startTime = idxStartTime >= 0 ? clean(cols[idxStartTime]) : "",
          endTime = idxEndTime >= 0 ? clean(cols[idxEndTime]) : "",
          confirmDeny = idxConfirmDeny >= 0 ? clean(cols[idxConfirmDeny]).toLowerCase() : "";

      if (confirmDeny !== "confirmed") return;

      if (!speaker || !description) return;

      var d = parseDate(cols[idxStartDate], idxEndDate >= 0 ? cols[idxEndDate] : "");
      if (!d) return;

      out.push({
        id: idx,
        speaker: speaker,
        title: title,
        description: description,
        bio: bio,
        location: location,
        startTime: startTime,
        endTime: endTime,
        day: d.day,
        mon: d.mon,
        year: d.year,
        dateLabel: d.label,
        isRange: d.isRange,
        endDateStr: d.endDateStr,
        sortKey: d.sortKey
      });
    });

    out.sort(function (a, b) {
      return b.sortKey - a.sortKey;
    });

    return out;
  }

  function formatEndDateLabel(endDateStr, fallbackLabel) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(endDateStr || ""));
    if (!m) return fallbackLabel;
    var monthIndex = parseInt(m[2], 10) - 1;
    var dayNum = parseInt(m[3], 10);
    return MONTH_FULL[monthIndex] + " " + dayNum + ", " + m[1];
  }

  /* ---------- rendering ---------- */
  function frame(inner) {
    ROOT.innerHTML = "";
    var card = el("div", "border:1px solid #e3e3e0; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06);");
    card.appendChild(inner);
    ROOT.appendChild(card);
  }

  function renderMessage(msg) {
    var wrap = el("div");
    var bar = el("div", "background:#fff; border-bottom:1px solid #e3e3e0; padding:10px 16px; font-family:" + HEAD + "; font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:11px; color:" + SLATE + ";", { text: "Events" });
    wrap.appendChild(bar);
    wrap.appendChild(el("div", "padding:18px 16px; font-size:13px; color:" + GRAY + ";", { text: msg }));
    frame(wrap);
  }

  function renderList() {
    view = "list";
    var wrap = el("div");

    var ul = el("ul", "list-style:none; margin:0; padding:0;");

    events.slice(0, VISIBLE).forEach(function (ev) {
      var li = el("li");
      var rowBg = "transparent";

      var btn = el(
        "button",
        "display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer; border:none; border-bottom:1px solid #ebebe7; background:" + rowBg + "; padding:13px 16px 13px 14px; transition:background .12s ease;",
        {
          attrs: { type: "button" },
          on: {
            click: function () {
              selectedId = ev.id;
              renderDetail();
            }
          }
        }
      );

      hover(btn, "#f1f4f2", rowBg);

      var dateCol = el("span", "display:flex; flex-direction:column; align-items:center; flex:0 0 42px; line-height:1;");
      dateCol.appendChild(el("span", "font-family:" + HEAD + "; font-weight:700; font-size:22px; color:#1c1c1c;", { text: ev.day }));
      dateCol.appendChild(el("span", "font-family:" + HEAD + "; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:11px; color:" + GRAY + "; margin-top:2px; white-space:nowrap;", { text: ev.mon + " '" + ev.year.slice(2) }));
      btn.appendChild(dateCol);

      var txtCol = el("span", "flex:1 1 auto; min-width:0;");
      txtCol.appendChild(el("span", "display:block; font-family:" + HEAD + "; font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:10px; color:" + TEAL + "; margin-bottom:2px;", { text: ev.title ? ev.speaker : "Guest Speaker" }));
      txtCol.appendChild(el("span", "display:block; font-family:" + BODY + "; font-weight:600; font-size:13.5px; line-height:1.3; color:#1c1c1c; overflow-wrap:anywhere;", { text: ev.title || ev.speaker }));
      btn.appendChild(txtCol);

      li.appendChild(btn);
      ul.appendChild(li);
    });

    wrap.appendChild(ul);

    var seeAll = el(
      "a",
      "display:flex; align-items:center; justify-content:center; gap:8px; width:100%; text-decoration:none; border-top:1px solid #e3e3e0; background:#fff; padding:14px 16px; font-family:" + HEAD + "; font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:13px; color:" + GREEN + "; box-sizing:border-box;",
      {
        html: "See all events <span style=\"font-size:13px; line-height:1;\">&rarr;</span>",
        attrs: {
          href: ALL_URL,
          target: "_blank",
          rel: "noopener noreferrer"
        }
      }
    );

    hover(seeAll, "#f1f4f2", "#fff");
    wrap.appendChild(seeAll);

    frame(wrap);
  }

  function renderDetail() {
    view = "detail";

    var ev = null;
    for (var i = 0; i < events.length; i++) {
      if (events[i].id === selectedId) {
        ev = events[i];
        break;
      }
    }

    if (!ev) {
      renderList();
      return;
    }

    var pad = el("div", "padding:22px 20px 30px;");

    var back = el(
      "button",
      "display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:0; margin:0 0 16px; cursor:pointer; font-family:" + HEAD + "; font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:13px; color:" + GREEN + ";",
      {
        html: "<span style=\"font-size:16px; line-height:1;\">&larr;</span> All events",
        attrs: { type: "button" },
        on: { click: renderList }
      }
    );

    pad.appendChild(back);

    pad.appendChild(el("p", "margin:0 0 7px; font-family:" + HEAD + "; font-weight:600; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:" + TEAL + ";", { text: ev.title ? ev.speaker : "Guest Speaker" }));
    pad.appendChild(el("h3", "margin:0 0 13px; font-family:" + HEAD + "; font-weight:700; font-size:25px; line-height:1.12; color:#1c1c1c; text-wrap:balance;", { text: ev.title || ev.speaker }));

    var meta = el("div", "display:flex; flex-wrap:wrap; gap:8px 20px; padding:0 0 16px; margin:0 0 20px; border-bottom:2px solid " + GREEN + ";");
    var dateChip = el("span", "display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:#444;");
    dateChip.appendChild(el("span", "display:inline-block; width:8px; height:8px; border-radius:50%; background:" + GOLD + "; flex:none;"));
    dateChip.appendChild(el("span", "", { text: ev.isRange ? (ev.dateLabel + " – " + formatEndDateLabel(ev.endDateStr, ev.dateLabel)) : ev.dateLabel }));
    meta.appendChild(dateChip);

    if (ev.startTime) {
      var timeChip = el("span", "display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:#444;");
      timeChip.appendChild(el("span", "display:inline-block; width:8px; height:8px; border-radius:50%; background:" + GOLD + "; flex:none;"));
      timeChip.appendChild(el("span", "", { text: (ev.endTime && ev.endTime !== ev.startTime ? ev.startTime + "\u2013" + ev.endTime : ev.startTime) + " ET" }));
      meta.appendChild(timeChip);
    }

    pad.appendChild(meta);

    ev.description.split(/\n\s*\n/).map(function (p) {
      return p.trim();
    }).filter(Boolean).forEach(function (p) {
      pad.appendChild(el("p", "margin:0 0 15px; font-size:15.5px; line-height:1.65; color:#333;", { text: p }));
    });

    if (ev.bio) {
      var bio = el("div", "margin-top:22px; background:#f7f7f4; border-left:4px solid " + GREEN + "; padding:16px 18px;");
      bio.appendChild(el("p", "margin:0 0 8px; font-family:" + HEAD + "; font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:12px; color:" + GREEN + ";", { text: "About " + ev.speaker }));
      bio.appendChild(el("p", "margin:0; font-size:14px; line-height:1.6; color:#444;", { text: ev.bio }));
      pad.appendChild(bio);
    }

    frame(pad);
  }

  /* ---------- load ----------
     Events are baked in at build time (see scripts/bake_ai_x_widgets.py) —
     no runtime fetch, so this widget renders standalone anywhere including
     GitHub Pages iframes and OmniCMS pastes. Re-run the bake script after
     every Box CSV sync to refresh EVENTS_CSV below. */
  function load() {
    try {
      events = buildEvents(EVENTS_CSV);
    } catch (e) {
      renderMessage("Events are unavailable right now.");
      return;
    }

    if (!events.length) {
      renderMessage("No events to display.");
      return;
    }

    selectedId = events[0].id;
    renderList();
  }

  load();
})();
/* ]]> */
</script>
