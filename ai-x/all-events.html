var EVENTS_CSV = "confirm_deny,url,title,detail,location,speaker,bio,start_date,start_time,end_date,end_time,source_type\r\nConfirmed,,Reasoning Guardrails for the Agentic Web,\"Large language models are shifting from text predictors to agents that operate on the web and within software systems. This transition amplifies safety risks across dialogue, the environments agents control, and compliance with real-world policies. This talk presents ThinkGuard, a reasoning-based guardrail trained via mission-focused distillation to acquire deliberative thinking without costly manual annotation. By reasoning over goals, constraints, and latent hazards, ThinkGuard generalizes to implicit, complex, and previously unseen risks. I will also outline guardrail extensions that enforce policy compliance for web and system agents, and omnimodal guardrails that vet and steer interactions involving images, audio, and video. Together, these techniques transform guardrails from brittle filters into adaptive, explanatory safety layers that preserve utility while measurably reducing failure in agentic workflows.\",,Muhao Chen,\"Muhao Chen is an Assistant Professor at the Department of Computer Science, UC Davis, where he leads the Language Understanding and Knowledge Acquisition (LUKA) Group. He received his Ph.D. from the Department of Computer Science at UCLA, and B.S. in Computer Science from Fudan University. His research focuses on robust and accountable ML, particularly on accountability and security issues of large language models and agentic AI. He serves several organizational roles within the Association for Computational Linguistics (ACL), and has organized a number of tutorials and workshops at leading NLP and AI conferences. His work has been recognized with EMNLP Outstanding Paper Awards (2023, 2024), an ACM SIGBio Best Student Paper Award (2020), faculty research awards from Amazon (2022, 2023) and Cisco, and funding support from multiple NSF, DARPA, IARPA, and industry grants.\",2026-01-23,,2026-01-23,,ai-x\r\nConfirmed,,,\"Despite rapid advances in artificial intelligence, many clinical AI models fail to achieve real-world healthcare impact. The primary barrier is often not model performance, but misalignment between AI methods, clinically meaningful questions, and access to appropriate real-world data. This talk presents a practical roadmap for computer science and engineering investigators interested in conducting high-impact clinical AI research at scale. We introduce a structured evidence-gap discovery framework that combines systematic reviews and clinical practice guidelines with AI-assisted extraction and human validation to identify clinically important, measurable, and fundable research questions. These gaps are then mapped to appropriate AI tasks\u00ef\u00bf\u00bdincluding prediction, natural language processing, computer vision, and multimodal modeling\u00ef\u00bf\u00bdand to real-world clinical, administrative, registry, and social determinant datasets. The session also reviews realistic data access pathways, governance considerations, and collaboration models. Attendees will leave with a concrete framework for moving from idea to dataset to fundable clinical AI study, grounded in real-world clinical needs and data constraints.\",,Ricardo Pietrobon,\"Ricardo Pietrobon, MD, PhD, MBA\u00ef\u00bf\u00bdis the CEO of SporeData Inc. and a physician-scientist with deep expertise in clinical research, real-world data, and large-scale health analytics. Trained in medicine, epidemiology, biomedical informatics, and business, he previously held senior academic and leadership roles at Duke University, where he served as Director of Biomedical Informatics for the Duke Center for Translational Sciences Award (CTSA). Dr. Pietrobon has authored hundreds of peer-reviewed publications spanning clinical epidemiology, health services research, informatics, and research methodology. His current work focuses on enabling clinically meaningful AI by aligning advanced analytic methods with real-world healthcare data, evidence gaps, governance models, and fundable research pathways. He works closely with academic investigators to translate AI innovation into scalable, clinically relevant impact.\u00ef\u00bf\u00bd\u00ef\u00bf\u00bd\",2026-02-06,,2026-02-06,,ai-x\r\nConfirmed,,Advancing Controllable Image Generation with Consistency and Preference Optimization,\"This presentation will explore recent advances in controllable image generation using diffusion models, with a focus on achieving precise alignment between generated images and structured visual conditions such as segmentation masks, edges, depth maps, and human poses. The talk will begin by outlining the limitations of existing conditional diffusion methods, which often lack explicit objectives to enforce fine-grained controllability. I will then introduce two recent approaches that address this challenge through consistency- and preference-based learning. The first leverages pixel-level cycle consistency and efficient reward fine-tuning to strengthen adherence to input controls without incurring the high computational cost of full diffusion backpropagation. The second reformulates controllable generation as a condition-level preference optimization problem, enabling robust optimization across all diffusion timesteps. Together, these methods demonstrate significant improvements in controllability while preserving image quality, highlighting new directions for reliable and scalable control in generative vision models.\",,Chen Chen,\"Dr. Chen Chen is an Associate Professor at the Center for Research in Computer Vision (CRCV) and the Institute of Artificial Intelligence at the University of Central Florida. He received his Ph.D. in Electrical Engineering from The University of Texas at Dallas in 2016, where he was awarded the David Daniel Fellowship for Best Doctoral Dissertation. His research interests span computer vision, controllable and efficient generative models, multimodal and federated learning, and medical and healthcare AI. He has led and participated in numerous federally and industry sponsored research projects supported by NSF, USDA, IARPA, and industry partners, with a focus on scalable, resource-efficient visual intelligence systems. Dr. Chen serves as an Associate Editor for IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI) and IEEE Transactions on Circuits and Systems for Video Technology (T-CSVT), and has served as an Area Chair for major conferences including ICCV, NeurIPS, ECCV, CVPR, ACM Multimedia, and ICME. He has published extensively, with over 30,000 citations and an h-index of 83 according to Google Scholar\",2026-02-13,,2026-02-13,,ai-x\r\nConfirmed,,\"Geospatial Understanding of Foundation Models: Self-Supervision, Robustness, and Resource-Constrained Learning\",\"Large-scale geospatial understanding from satellite imagery remains less mature than natural-image vision. Current practice often relies on narrow, task-specific pipelines, and there is limited work on truly task-agnostic foundation models that remain robust under domain shift, geographic variation, and diverse real-world scenes. We advance remote-sensing foundation-model development and evaluation along three axes. First, we build self-supervised multispectral models for satellite image classification by adapting common SSL methods (BYOL, Barlow Twins, DINO, MoCo, SimSiam) to multispectral inputs. We pretrain on EuroSAT and BigEarthNet and evaluate cross-dataset transfer. The resulting multispectral checkpoints, especially those trained on BigEarthNet achieve strong transfer despite using only a fraction of the data typically used in ImageNet-scale training. Second, we benchmark eight ViT-based geospatial foundation models (including SatMAE/Scale-MAE/Cross-Scale MAE, the Geospatial Foundation Model, and supervised multi-task pretraining) via end-to-end fine-tuning on four downstream tasks: classification, segmentation, oriented object detection, and change detection. Performance is highly task-dependent: models are competitive for classification and segmentation but underperform for change detection and oriented detection, and cross-dataset generalization degrades when imagery comes from different satellites. Across experiments, pretraining data quality (spatial resolution and scene diversity) matters more than dataset size, and scaling from ViT-Base to ViT-Large yields ~1% gains. Finally, we introduce Hierarchical Attention Distillation (HAD) to transfer multi-scale spatial and semantic representations from a large teacher to a compact student using unlabeled data, reducing parameters to less than 5% of state-of-the-art solutions while retaining competitive performance.\",,Gilbert Rotich,,2026-02-20,,2026-02-20,,ai-x\r\nConfirmed,,Understanding How Children and Adults Interact with Virtual Objects in Augmented Reality Headsets,\"Current augmented reality (AR) headset applications often rely on predefined gesture sets that fail to align with users' natural expectations, leading to unintuitive experiences. To address this gap, we conducted two separate open-ended elicitation studies with 30 adults and 20 children (ages 9-12). Participants were tasked with replicating 17 different actions (e.g., moving, rotating) on a 3D virtual cube using any interaction modality they preferred.\u00ef\u00bf\u00bdOur findings reveal critical differences and similarities across both participant groups. Adults predominantly default to direct hand manipulation (comprising 82%\u00ef\u00bf\u00bdof first choices) , but demonstrate a strong preference for interaction flexibility, with 52%\u00ef\u00bf\u00bdof secondary proposals switching to a different modality. Their mental models are largely grounded in real-world experiences, naive physics, and pop culture. Conversely, children expect to engage their entire bodies (e.g., kicking, running) and frequently incorporate external physical or imagined objects as tools. Furthermore, children distinctively construct narratives around their interactions to contextualize abstract tasks. By comparing these distinct mental models, this talk highlights the necessity of moving beyond static, unimodal gesture sets. We will discuss actionable design recommendations for future AR headset applications, emphasizing the need for multimodal flexibility, whole-body tracking, and physics-aware virtual environments to accommodate the diverse, intuitive expectations of all users.\",,Alejandro,,2026-03-13,,2026-03-13,,ai-x\r\nConfirmed,,Simulating Impaired Speech Dialogue: A Preclinical Testbed for Conversational AI in Communication Disorders,\"Conversational artificial intelligence (C-AI) has the potential to scale speech-language therapy, yet current systems often fail when exposed to the variability and error patterns characteristic of disordered speech. This reflects a key limitation in the clinical development pipeline, where AI systems are evaluated under idealized conditions without preclinical testing in realistic impairment-rich communicative contexts. This talk introduces Agent-Based Conversational Dialogue (ABCD), a simulation-based framework that models impaired speech dialogue as a preclinical testbed for conversational AI in communication disorders. ABCD integrates agent-based modeling with large language models to simulate dynamic, multi-turn interactions between a virtual patient agent with communication disorders (e.g., aphasia) and a virtual clinician. This enables rapid, large-scale testing of AI systems without requiring human participants. Using this framework, two studies are presented. Study 1 demonstrates feasibility, showing that AI clinicians maintain high coherence and therapeutic appropriateness despite errorful input. Study 2 demonstrates that response accessibility is a tunable parameter influenced by prompting strategies, model architecture, and reasoning mode. Beyond evaluation, ABCD enables generation of synthetic disordered speech data by parameterizing linguistic error types, severity levels, and multimodal perturbations. These datasets may support robust, inclusive AI training. Together, ABCD establishes a scalable, simulation-first paradigm for developing safe and clinically effective conversational AI.\",,Gerald C. Imaezue,,2026-03-27,,2026-03-27,,ai-x\r\nConfirmed,,Improving Assertion-Based Hardware Verification with Semantic Alignment Checking using Large Language Models,\"Large language models (LLMs) are increasingly being integrated into hardware design verification workflows, particularly for SystemVerilog Assertion (SVA) generation. However, existing approaches primarily emphasize syntactic correctness and formal verification for evaluation, while the semantic alignment between generated assertions and natural language design specifications remains difficult to quantify and ensure. This gap introduces risks of hallucinated or vacuous assertions, reducing confidence and increasing debugging effort, especially in the absence of golden RTL. Bridging this gap requires a method that enforces semantic alignment throughout the generation process rather than a post-generation step.\u00ef\u00bf\u00bdThis talk will begin with a review of the current state of the art SVA generation methodologies and their limitations. To address these challenges, we present SpecAlign, a framework for evaluating and refining LLM-generated SVAs with a novel approach that explicitly enforces semantic alignment between assertions and the specification. SpecAlign iteratively refines and provides evidence for natural language properties and SVAs with the goal of improving consistency, explainability, and confidence. This is achieved with two evidence- and reasoning-based loops that classify properties and SVAs based on semantic alignment and generate structured feedback and evidence. Additionally, SpecAlign provides a quantitative alignment score to measure semantic alignment across iterations, providing an alternative to traditional evaluation methods that rely on formal verification and golden RTL. The talk concludes with a discussion of future research directions in LLM-based SVA generation and the broader role of LLMs in hardware verification.\",,Jaime Imperial,,2026-04-10,,2026-04-10,,ai-x\r\nConfirmed,,Active Perception in Dynamic and Unknown Environment,\"Sensing is a crucial component of autonomous systems, providing the necessary information to interact with and understand the environment. However, environmental conditions often limit the effectiveness of sensing capabilities, making perception inherently uncertain. This talk will address the challenges of underwater sensing and perception, emphasizing the need for autonomous systems to manage uncertainties arising from dynamic and unknown environments. Drawing from lessons learned in a previous project on underwater object recognition, I will discuss the role of planning algorithms in active sensing to reduce perception uncertainties. I will also introduce ongoing research efforts that integrate planning and perception, focusing on how these methods can enhance the performance of autonomous systems in challenging underwater settings.\",,Jane Sine,\"Jane Shin is an Assistant Professor in the Mechanical and Aerospace Engineering Department at the University of Florida. She received her M.S. and Ph.D. in Mechanical Engineering from Cornell University and a B.S. in Naval Architecture and Ocean Engineering from Seoul National University. During her Ph.D., she was selected as a Commercialization Fellow at Cornell in 2020. She was selected as one of IEEE Oceanic Engineering Society YP-Boost Laureates in 2025. Her expertise lies in autonomous systems, robotics, and active perception, where she focuses on addressing the uncertainties in perception caused by challenging environmental conditions.\",2026-04-17,,2026-04-17,,ai-x\r\nConfirmed,,From Scaling to Safety: How Test-Time Compute Introduces a New Attack Surface in LLMs,\"Large Language Models (LLMs) are a key part of modern artificial intelligence, used in tasks ranging from complex reasoning to everyday interactions. As demand for better performance grows, they are made smarter through scaling, using more data, larger models, and more recently, Test-Time Scaling (TTS). TTS uses extra compute at inference time to generate better responses. While this improves output quality and reasoning, its safety risks are still not well understood. In this talk, I will explain how LLMs work, how scaling improves them, and why these improvements can also introduce new risks. I will begin with an overview of LLMs and scaling methods, focusing on TTS approaches such as Best-of-N. These methods can be understood through three main components: how responses are generated, how they are scored, and how much computation is used. Next, I will connect traditional adversarial attacks on LLMs to new risks introduced by TTS. I will then present our work, \u00ef\u00bf\u00bdLess Diverse, Less Safe\u00ef\u00bf\u00bd, which identifies a new failure mode related to diversity in generated responses. I will show that this safety concern arises across different TTS methods and models and demonstrate that the threat can be transferred to closed-source systems and can bypass strong safety guardrails. I conclude by highlighting the need for safety-aware TTS design as an important step toward building safer and more reliable AI systems.\",,Shahriar Kabir Nahin,,2026-04-24,,2026-04-24,,ai-x\r\nConfirmed,,Curvature-Weighted Capacity Allocation: A Minimum Description Length Framework for Layer-Adaptive Large Language Model Optimization,\"As large language models scale to trillions of parameters, hardware constraints on memory and compute become severe physical bottlenecks. A key driver of this inefficiency is that neural network layers are not created equal: some layers do the heavy lifting to reduce errors, while others are nearly redundant. Existing methods attempt to manage this, but they rely on gradient-based trial-and-error heuristics that ignore the local \"\"curvature\"\" of the learning landscape. These heuristics offer no guarantees and are computationally expensive, leading to a suboptimal distribution of resources and performance. To solve this, we take inspiration from information theory, especially the Minimum Description Length principle, to design a framework that acts as a mathematically rigorous budget manager for LLMs and any other AI models. By calculating a curvature-adjusted score for each layer, our system assesses a layer's true reducible risk and its actual potential to improve the model. It then uses a single convex optimization program to automatically drive two capacity allocation decisions: allocating extra computing capacity to the high-performing layers or pruning away wasted parameters from the low-performing ones. Tested on models like Mistral-7B and Gemma-7B, with benchmarks which include CoLA, MRPC, CommonsenseQA, etc. This budget-feasible approach replaces empirical guesswork with provable optimization guarantees, maximizing efficiency strictly within a global hardware limit.\",ENG 4,Theophilus Amaefuna,Theophilus is a Fourth-year PhD student from the Trustworthy Knowledge-Driven AI (TKAI) Lab. My work focuses on Predictive Coding models and Verifiable Large Language Models on formal languages.,2026-09-18 00:00:00,13:00:00,2026-09-18 00:00:00,1:50pm,ai-x\r\nConfirmed,,Revisiting the Effectiveness of LLM Pruning for Test-Time Scaling,\"Large Language Models (LLMs) now exhibit remarkable growth in reasoning capabilities through test-time scaling (TTS). TTS uses additional compute during inference by generating thinking tokens. While TTS has significantly enhanced the reasoning capabilities of LLMs, these improvements come at the cost of increased inference time and computational demands. Model pruning provides a promising way to reduce these computational requirements by removing redundant parameters from the model. However, previous work has shown that naively pruning reasoning models can lead to severe degradation in performance. In this talk, I will show that, unlike structured pruning approaches that past work has explored in the context of reasoning and TTS, unstructured pruning methods can retain reasoning performance comparable to the full model, and at times even exceeding it. I will conclude by discussing what these findings reveal about reasoning models and their broader implications for building more efficient AI systems without sacrificing capability.\",ENG 4,Ocean Monjour,\"Ocean Monjur is a 1st year PhD student in the Bellini College of Artificial Intelligence, Cybersecurity and Computing at the University of South Florida. He is part of the PALM Lab led by Dr. Anshuman Chhabra. His research focuses on improving the interpretability and robustness of agentic systems and large language models (LLMs).\",2026-09-25 00:00:00,13:00:00,2026-09-25 00:00:00,1:50pm,ai-x\r\nConfirmed,https://www.eventbrite.com/e/ai-fluency-pathway-tampa-tickets-1991753726011,AI Fluency Pathway - Tampa,Build AI fluency and apply AI responsibly in real-world and workplace contexts.,,,,2026-07-16,,2026-07-16,,community\r\nConfirmed,https://www.eventbrite.com/e/generative-ai-and-ai-agent-tampa-tickets-1991752849389?aff=ebdssbdestsearch,Generative AI and AI Agent - Tampa,Explore generative AI and AI agent skills.,,,,2026-07-01,,2026-07-01,,community\r\nConfirmed,https://www.eventbrite.com/e/ai-specialists-aiconnect-forge-your-career-path-expand-your-network-tampa-tickets-1991712702308?aff=ebdssbdestsearch,AI Specialists: AIConnect - Forge Your Career Path & Expand Your Network - Tampa,\"Join us for specialists aiconnect networking in Tampa on 10 Jul 2026, 5 PM EDT. Connect with professionals!\",,,,2026-07-10,,2026-07-10,,community\r\nConfirmed,https://business.southtampachamber.org/events/details/summer-school-series-advanced-ai-prompting-for-beginners-42305,SUMMER SCHOOL SERIES: Advanced AI Prompting for Beginners,\"Where business professionals can level up their skills and connect with peers in a dynamic, hands-on learning environment.\",,,,2026-07-08,,2026-07-08,,community\r\nConfirmed,https://worldresearchsociety.com/Conference/65159/GSAIET/registration,Global Summit on Artificial Intelligence and Emerging Technologies,\"The conference provides an international platform for professionals, researchers, academicians, and industry experts involved in Artificial Intelligence and Emerging Technologies to exchange knowledge and gain insights into the latest developments,\",,,,2026-06-27,,2026-06-27,,community\r\nConfirmed,https://www.joinaiweek.com/tampa,AI Conference for Tampa Inventors,\"Tampa AI Week blends conference-level insights with the energy of a high-impact meetup. As a leading Florida AI Conference, Tampa AI Week brings together operators, executives, developers, and innovators for practical sessions, community events, and meaningful connections across the Tampa AI ecosystem.\",,,,2026-10-13,,2026-10-13,,community\r\nConfirmed,https://tampa.dev/events/4bc1f5e3-1258-40cb-bba3-7455119ce383,\"Security Vulnerabilities, Fines, Failures that await in Vibe Coding\",\"Regardless of what you are Vibe coding with - This is Important. Claude Code, Bolt, Lovable, Cursor, Replet, Base64... They all have the same weaknesses. No documentation. Weak database development. Exposing credentials. Not enforcing database RLS. No documentation. Poor database design leading to possible collapse under heavy use. SEO Invisible. Poor or no Social Media capabilities.\",,,,2026-08-19,,2026-08-19,,community\r\nConfirmed,https://tampa.dev/events/e2110bb5-fe9b-483c-a4fa-00149047189f,Data Analytics & AI - Tampa Bay - September MEETUP,\"For most businesses and organizations, data analytics and business intelligence is used to support mandatory business functions. For data scientists, the tools and technologies are ever-changing. Join local experts in discussing current trends and topics in the analytics field, including AI and ML, data science, business analytics, systems design, database management, data mining, and more..\",,,,2026-09-09,,2026-09-09,,community\r\nConfirmed,https://dev.events/conferences/day-of-data-orlando-2026-lq6-pc3q,Data of Day Orlando 2026,Orlando's 19th Annual Day of Data (SQL Saturday) is a FREE one-day training event for IT professionals and students interested in data platforms.,,,,2026-10-17,,2026-10-17,,community\r\nConfirmed,https://dev.events/conferences/live-360-tech-con-2026-y8kk6ubt,Live! 360 Tech Con,\"Live! 360 Tech Con brings together IT pros, developers, data and security experts, enterprise and AI engineers, and technology leaders to sharpen skills, share best practices, and stay ahead of what\u2019s next. Join us in Orlando this November as we put the Future in Focus\u2014deepening your AI expertise, fueling innovation, and propelling your career forward.\",,,,2026-11-15,,2026-11-15,,community\r\nConfirmed,https://www.eventbrite.com/e/women-in-tech-entrepreneurship-813-tech-day-by-tbtw-tickets-1993939460602?aff=ebdssbdestsearch,Women in Tech & Entrepreneurship + 813 Tech Day by TBTW,\"A casual gathering of high-performing, non-conforming women founders, tech workers, VCs, and hype girls This month\u2019s Tampa Chapter meeting is special as we\u2019re partnering with Tampa Bay Tech Week to celebrate 8-1-3 Day during - a community-wide celebration of the people, companies, and ideas driving our region\u2019s thriving innovation ecosystem. It\u2019s the perfect opportunity to expand your network, exchange ideas, and build meaningful relationships with women across industries who believe that collaboration is more powerful than competition.\",,,,2026-08-13,,2026-08-13,,community\r\nConfirmed,https://www.eventbrite.com/e/tampa-job-fairs-tampa-career-fairs-tickets-1996240559250?aff=ebdssbdestsearch,Tampa Job Fairs - Tampa Career Fairs,Get invited to meet Tampa technology employers hiring now.,,,,2026-08-27,,2026-08-27,,community\r\nConfirmed,,Beyond Data: Imperfect Physics as a Prior for Reinforcement Learning,\"Reinforcement learning (RL) promises agents that can improve through experience using only the supervision provided by a reward function. In robotics, however, real-world interaction is expensive, dense rewards are difficult to specify, and sparse rewards often lead to sample-inefficient learning. In this talk, I explore whether imperfect physics priors can nevertheless provide useful structure for RL. Focusing on goal-conditioned RL (GCRL) for robot navigation and manipulation, I show how control-theoretic principles can serve as inductive biases for policy learning. We first connect goal-reaching value functions to time-to-go fields and interpret the Eikonal equation as a simplified surrogate for the Hamilton-Jacobi-Bellman equation, motivating Eikonal-informed value learning for challenging navigation problems. We then study its interaction with the quasimetric structure typical of GCRL. Their combination reveals the limitations of imposing these priors globally and motivates a hierarchical formulation. This becomes particularly important in contact-rich manipulation, where hybrid dynamics induce state-dependent controllability and motivate applying physics-informed structure only to appropriate state representations.\",,Vittorio Giammarino,\"Vittorio Giammarino is an Assistant Professor in the Department of Industrial and Management Systems Engineering at the University of South Florida, where he leads the Learning-enabled Autonomy (LEA) Lab. His research lies at the intersection of Reinforcement Learning and Control Theory with a focus on developing data-efficient, safe, and physically grounded learning methods for autonomous systems. Before joining USF, he was a Postdoctoral Research Associate at Purdue University. He received his Ph.D. in Systems Engineering from Boston University, his M.Sc. in Systems and Control from TU Delft, and his B.Sc. in Automation Engineering.\",2026-09-11,,2026-09-11,,community\r\nConfirmed,https://members.tampabay.tech/communityeventscalendar/Details/advanced-ai-engineer-certification-1905177?sourceTypeId=Website,Advanced AI Engineer Certification,,,,,2026-08-15,,2026-08-15,,community\r\nConfirmed,https://tampa.dev/events/f015f38c-1bdf-4e21-906a-551f4906998b,Microsoft Azure AI Foundey,\"Microsoft AZURE AI Foundry - A Project Manager's Perspective Presentation Overview Travis has attended multiple AI-focused sessions at the ECC and has found significant value in learning from the developers, engineers, and AI practitioners within the Tampa AI Applications Meetup community. After several recent encounters with Microsoft Azure AI Foundry, Travis began exploring the platform and recognized an opportunity to introduce an enterprise-level Microsoft AI development and delivery environ\",,,,2026-09-10,,2026-09-10,,community\r\nConfirmed,https://tampa.dev/events/3d4374c5-b964-4e43-8aff-62930873d10f,Building a Mini-Software Factory using Pi.dev and Local LLMs,\"Most AI coding assistants are sealed cloud platforms heavy on dashboards and light on local control. Enter pi.dev\u2014an open-source, terminal-based agent harness that strips away the bloat to give local LLMs direct access to a minimal toolset (read, write, edit, bash). In this talk, we\u2019ll explore how to harness this minimalist architecture to build a local \"\"mini-software factory.\"\" I\u2019ll show you how to feed a structured application specification to pi.dev and watch it autonomously architect, generat\",,,,2026-09-14,,2026-09-14,,community\r\nConfirmed,https://members.tampabay.tech/communityeventscalendar/Details/advanced-ai-engineer-certification-1905181?sourceTypeId=Website,Advanced AI Engineer Certification,,,,,2026-09-15,,2026-09-15,,community\r\nConfirmed,https://business.stpete.com/eventcalendar/Details/ai-101-part-4-how-to-best-use-ai-to-automate-all-your-promotion-including-social-media-the-three-1895572?sourceTypeId=Website,\"AI 101 Part 4: How To Best Use AI To Automate All Your Promotion, Including Social Media: The Three\",Automate your social media content from research to posting - whether you're just getting started or ready to build a fully custom AI content machine.,,,,2026-09-15,,2026-09-15 00:00:00,,community\r\nConfirmed,https://members.tampabay.tech/communityeventscalendar/Details/future-proof-your-workforce-with-tampa-bay-tech-1915906?sourceTypeId=Website,Future-Proof Your Workforce with Tampa Bay Tech,\"How Leading Employers Are Solving the Talent Shortage Through Apprenticeships The workforce is changing faster than ever. Between AI, evolving skill requirements, an aging workforce, and increasing competition for experienced talent, employers are ...\",,,,2026-09-15,,2026-09-15,,community\r\nConfirmed,https://members.tampabay.tech/communityeventscalendar/Details/advanced-ai-engineer-certification-1905186?sourceTypeId=Website,Advanced AI Engineer Certification,,,,,2026-10-15,,2026-10-15,,community\r\nConfirmed,https://www.meetup.com/dataanalyticstampa/events/313005514/,Data Analytics & AI \u2014 Tampa Bay Monthly Meetup,\"Join local experts in discussing current trends and topics in the analytics field, including AI and ML, data science, business analytics, systems design, database management, data mining, and more\",\"2101 E Palm Ave \u00b7 Tampa, FL\",Ashish Bhutada,,2026-09-09 00:00:00,,2026-09-15 00:00:00,,community\r\nConfirmed,https://www.joinaiweek.com/tampa,The AI Conference for Tampa Innovators,\"Tampa AI Week blends conference-level insights with the energy of a high-impact meetup. As a leading Florida AI Conference, Tampa AI Week brings together operators, executives, developers, and innovators for practical sessions, community events, and meaningful connections across the Tampa AI ecosystem.\",Museum of Science & Innovation - MOSI,,,2026-10-14 00:00:00,,2026-10-15 00:00:00,,community\r\nConfirmed,https://cancode.org/programs/ai-webinar/,Voice as an Interface: Working Faster with AI,\"Can Code Communities monthly webinars help make AI accesible to everyone covering topics like LLM chatbots, prompt engineering, agentic systems and more.\",,,,2026-08-28 00:00:00,,2026-08-28 00:00:00,,community\r\nConfirmed,https://techxflorida.com/,TechX Florida 2026 Tech Conference,\"A free conference for students, professionals, academia and tech enthusiasts that brought 336 attendees last year.\",\"Marshall Student Center, University of South Florida, Tampa, FL\",,,2026-10-24 00:00:00,11:00:00,2026-10-24 00:00:00,17:00:00,community\r\nDenied,https://tampa.dev/events/ae23b726-ea05-4a5c-b64a-e66ac530c2eb,Known and Unknowns: Testing AI Generated Code,\"Let's face it AI-assisted coding is rapidly becoming the primary way applications are being written. The power of being able to write out a complicated application or feature with a just a few commands is something too alluring to pass up. But between the imprecise nature of language and LLMs ability to \"\"hallucinate\"\", this creates many opportunities for bugs and unintended behavior to introduced. Just telling an AI coding agent to \"\"write tests\"\" isn't going to be enough to build confidence in the\",\"Hillsborough Community College, Tampa, FL\",,,2026-09-24,,2026-09-24,,community\r\nDenied,https://tampa.dev/events/1fd3cc4b-b4e0-4783-8a5b-94a05ddfb917,Known and Unknowns: Testing AI-Generated Code,\"Tampa QA Meetup \u00d7 Tampa JUG Present \u00d7 Tampa Bay Tech & Beer AI-assisted coding is quickly becoming the primary way applications are built. While it allows developers to create complex applications and features with only a few prompts, ambiguous language and AI hallucinations can introduce bugs, hidden assumptions, and unintended behavior. Simply asking an AI coding agent to \u201cwrite tests\u201d isn\u2019t enough to guarantee correctness. Billy Korando is a Developer Advocate at Oracle and a member of the Ja\",\"Hillsborough College - Dale Mabry Campus, Tampa, FL\",,,2026-09-24,,2026-09-24,,community\r\nConfirmed,https://tampa.dev/events/e0191419-bdab-4692-843c-107941c6d92d,Known and Unknowns: Testing AI-Generated Code,\"Tampa QA Meetup \u00d7 Tampa JUG Present \u00d7 Tampa Bay Tech & Beer AI-assisted coding is quickly becoming the primary way applications are built. While it allows developers to create complex applications and features with only a few prompts, ambiguous language and AI hallucinations can introduce bugs, hidden assumptions, and unintended behavior. Simply asking an AI coding agent to \u201cwrite tests\u201d isn\u2019t enough to guarantee correctness. Billy Korando is a Developer Advocate at Oracle and a member of the Ja\",\"Hillsborough Community College - Dale Mabry Campus, Tampa, FL\",,,2026-09-24,,2026-09-24,,community\r\nConfirmed,https://tampa.dev/events/60385b40-da97-42d3-9538-c369c5218c89,AWS Transform,\"Cloud migration is no longer the finish line. Today's organizations are under pressure to reduce technical debt, modernize legacy applications, lower licensing costs, and prepare their environments for AI-driven development. Everyone is talking about AI-generated code, but what about the millions of lines of legacy code already running your business? In this session, we'll explore how AWS Transform can help organizations modernize applications, reduce technical debt, and turn legacy systems into\",\"Entrepreneur Collaborative Center (ECC), Tampa, FL\",,,2026-09-30,,2026-09-30,,community\r\nConfirmed,https://members.tampabay.tech/communityeventscalendar/Details/evolve-with-apprenticeships-it-focus-with-careersource-tampa-bay-and-tampa-bay-tech-1919792?sourceTypeId=Website,Evolve with Apprenticeships: IT Focus with CareerSource Tampa Bay and Tampa Bay Tech,\"How Leading Employers Are Solving the Talent Shortage Through Apprenticeships The workforce is changing faster than ever. Between AI, evolving skill requirements, an aging workforce, and increasing competition for experienced talent, employers are ...\",\"Tampa, FL\",,,2026-09-30,,2026-09-30,,community\r\nConfirmed,,Revisiting the Effectiveness of LLM Pruning for Test-Time Scaling,\"Large Language Models (LLMs) now exhibit remarkable growth in reasoning capabilities through test-time scaling (TTS). TTS uses additional compute during inference by generating thinking tokens. While TTS has significantly enhanced the reasoning capabilities of LLMs, these improvements come at the cost of increased inference time and computational demands. Model pruning provides a promising way to reduce these computational requirements by removing redundant parameters from the model. However, previous work has shown that naively pruning reasoning models can lead to severe degradation in performance. In this talk, I will show that, unlike structured pruning approaches that past work has explored in the context of reasoning and TTS, unstructured pruning methods can retain reasoning performance comparable to the full model, and at times even exceeding it. I will conclude by discussing what these findings reveal about reasoning models and their broader implications for building more efficient AI systems without sacrificing capability.\",ENG 4,Ocean Monjur,\"Ocean Monjur is a 1st year PhD student in the Bellini College of Artificial Intelligence, Cybersecurity and Computing at the University of South Florida. He is part of the PALM Lab led by Dr. Anshuman Chhabra. His research focuses on improving the interpretability and robustness of agentic systems and large language models (LLMs).\",2026-09-25 00:00:00,01:00:00,2026-09-25 00:00:00,01:50:00,community\r\nConfirmed,,,,ENG 4,Yael Bensoussan,,2026-10-02 00:00:00,01:00:00,2026-10-02 00:00:00,01:50:00,community\r\nConfirmed,,,,ENG 4,Kaushik Dutta,,2026-10-09 00:00:00,01:00:00,2026-10-09 00:00:00,01:50:00,community\r\nConfirmed,,,,ENG 4,Shrestha Datta,,2026-10-16 00:00:00,01:00:00,2026-10-16 00:00:00,01:50:00,community\r\nConfirmed,,,,ENG 4,Chuchu Chen,,2026-10-23 00:00:00,01:00:00,2026-10-23 00:00:00,01:50:00,community\r\nConfirmed,,The Sociotechnical Imagination of Musical Machinery and Ecology: Analyzing the Technological Promises of AI Music Creation,\"\"\"The sociotechnical imaginaries of AI produce technological promises subject to a cycle of hype, disillusionment, and criticism. These future prognostications evolve as AI\u2019s capabilities expand, even as they result in a process of routinization, yielding artistic approaches rooted in the technology\u2019s failure to realize these espoused promises. The sociotechnical imaginary is a useful lens to examine how technological promises have produced AI-enhanced music practices from a pragmatism that continually reconciles with a techno-utopian futurity. The persuasiveness of AI\u2019s evolving technological promise has shaped discourses, expectations, and disillusion towards the present and future of musical creation. The myth of the intelligent machine\u2014an assemblage or apparatus that cannot just automate human labor but possesses creative agency\u2014contains philosophical and creative implications for musical intelligence in an age when an AI ecology consolidates the roles involved in music composition and performance while accelerating the process of its production. This talk examines three case studies that traverse the development of the AI\u2019s sociotechnical imaginaries, relating them to music creation. These instruments and platforms\u2014Minsky and Friedkin\u2019s Triadex Muse, Puckett and Zicarelli\u2019s Max/Msp~/Jitter, and the current commercial end-to-end AI-driven music platforms for hyper-reproduction, were developed in response to a contextualized cycle of hype, disillusion, and criticism. The routinization brought upon by the disillusion voiced towards the preceding technological promises greatly informed the creative scope and ambition in the following epoch of sociotechnological imaginaries. These case studies will be used to critique AI-driven music production under the latest era of the sociotechnical imaginary, demonstrating that contemporary technological promises will also be subject to an inevitable process of routinization. Yet, there are opportunities for bridging the previous imaginaries with the present promises, which can foster a routinization process that centers the performer as the real-time interlocutor between an evolving technological assemblage and their own musical intelligence, agency, and creativity. Rather than focusing on AI\u2019s rote technical functionality, these case studies and supporting theoretical sources will be used to both critique and confront these existing technological promises, and leverage them into contemplating the future of human-centered technological mediation in music creation. \"\"\",ENG 4,Steven Lewis,\"Steven Lewis joined the University of South Florida\u2019s Music Faculty in August of 2025, as Assistant Professor of Artificial Intelligence and Entrepreneurism in the Arts. As a percussionist, music technologist and multimedia artist, Steven\u2019s creative practice centers on designing multimodal interactive music systems, augmented instruments, and controllers that leverage emergent technologies in creative domains that emphasize live sound processing and improvisation between the human and the computer. His research focuses on analyzing the ontological, political, and economic transformations that AI has catalyzed in experimental and institutionalized music, with an emphasis on theorizing about on the convergence of virtuosity and creativity in AI-mediated performance and composition. His research and creative work has been accepted at the New York Electronic Music Festival, The Society of Electroacoustic Music in the United States, the International Computer Music Conference, the International Conference on AI and Music Creativity, the International Sound and Music Computing Conference, the International Timbre Conference, and the conference on 21st Century Musical Practices. He is a PhD graduate of the Improvisation, Composition, and Integrated Technology Program at the University of California, Irvine, and holds graduate degrees in Music Technology from NYU and Jazz Studies at the University of Miami\u2019s Frost School of Music. He is a proud alumni of the University of South Florida.\",2026-10-30 00:00:00,01:00:00,2026-10-30 00:00:00,01:50:00,community\r\nConfirmed,,,,ENG 4,Triparna De Vreede,,2026-11-06 00:00:00,01:00:00,2026-11-06 00:00:00,01:50:00,community\r\nConfirmed,,,,Remote (MS Teams),Minghan Wei,,2026-11-13 00:00:00,01:00:00,2026-11-13 00:00:00,01:50:00,community\r\nConfirmed,https://www.meetup.com/tampa-artificial-intelligence-applications-meetup-group/events/313947395,Automations with Manus.AI,Tampa AI Applications Meetup Group ONLINE EVENT - ZOOM CALL We are going to take a look at Manus.ai as a prompt-based tool that can be used for automating tasks. I currently use it for gathering news stories on two websites and am using it to collect event data for a third. It is prompt based and ca,Tampa AI Applications Meetup Group,,,2026-03-30,,2026-03-30,,community\r\nConfirmed,https://www.meetup.com/tampa-artificial-intelligence-applications-meetup-group/events/313285937,Prep Online event for AI Vibe coding - prepping our database,\"Tampa AI Applications Meetup Group This is ONLINE In preparation for the Vibe Coding event coming up on the 15th, I'm going to hold an Online event where I cover the preparation of the Airtable Database we will be using for our vibe coding project on the 15th. Airtable is a good light-duty database\",Tampa AI Applications Meetup Group,,,2026-04-13,,2026-04-13,,community\r\nConfirmed,https://www.meetup.com/tampa-artificial-intelligence-applications-meetup-group/events/313280428,Vibe Coding with Bolt.new,\"Tampa AI Applications Meetup Group A Very powerful use of AI tools includes \"\"Vibe Coding\"\". This is prompt coding to design a small to mediu illykorando.com/)** is a Developer Advocate at [Oracle](https://www.oracle.com/) and a member of the Java Platform Group\u2019s Developer Relations team. **What to Expect** Billy will walk through three distinct phases of testing AI-generated code\u2014from defining expected business behavior and covering edge cases to uncovering bugs and risks you may not have anticipated. \ud83c\udfaf **Highlights** * **Known knowns:** Use specification-driven development to clearly define the expected, business-relevant behavior of your application. * **Known unknowns:** Apply property-based testing to explore edge cases and avoid overfitting and unintended biases. * **Unknown unknowns:** Use static analysis and mutation testing to uncover issues that developers and AI agents may overlook. * **More reliable AI-generated code:** Move beyond simply asking an AI coding agent to \u201cwrite tests.\u201d * **Stronger test coverage:** Combine complementary testing methods to identify both expected and unexpected failures. * **A reusable testing framework:** Learn an approach that can evolve alongside rapidly changing AI coding tools. **Agenda** **5:45 PM\u20136:15 PM:** Food and networking **6:15 PM\u20137:15 PM:** Presentation **7:15 PM\u20137:45 PM:** Closing and raffle **7:45 PM onward:** Continue the conversation at a nearby bar or restaurant **Location** The event will take place in **DTEC 427.** Please see the attached image for the building and parking locations. **Sponsor** Thank you to our sponsor, **iDelsoft**, for its generous support. **iDelsoft** helps high-growth startups build and scale engineering teams through a network of more than 30,000 vetted developers across 150+ technologies. Hiring, or exploring your next opportunity? Visit [idelsoft.com](https://idelsoft.com/).\",Hillsborough College - Dale Mabry Campus,,,2026-09-24,,2026-09-24,,community\r\nConfirmed,https://www.eventbrite.com/e/practical-ai-for-small-business-growth-hands-on-ai-workshop-tickets-1999935225095 t connected. **5:30\u20136:00 PM \u2014 Welcome to TECHAPALOOZA** Opening remarks from **Disrupt the Bay \u00d7 Masterminds Tampa Bay** and introduction of our featured speakers. **6:00\u20136:30 PM \u2014 Featured AI Panel: From AI Hype to Real-World Implementation** A candid conversation about where AI is actually delivering value, where organizations are getting it wrong, and what leaders need to consider around adoption, strategy, governance, security and execution. Featuring: **Nick Palomba \u2014 Microsoft** **John O'reilly \u2014 Google** **Jennifer Bryk \u2014 RebelEdge Advisory** **Ren\u00e9 Clayton \u2014 Byte Strategy AI** **Brian Andrews - Sofwerx** **6:30\u20136:45 PM \u2014 Audience Q&A** **6:45\u20137:15 PM \u2014 TECHAPALOOZA Speed Networking \u26a1** Fast-paced introductions designed to connect founders, executives, technologists, AI practitioners and innovators across Tampa Bay. **7:15\u20138:00 PM \u2014 Open Networking + Food & Beverages** Keep the conversations going, make meaningful connections and meet the people helping shape Tampa Bay\u2019s technology ecosystem. **\\*\\*RSVP - Be sure to use the Eventbrite Registration link at the top of the description to secure your spot\\*\\***\",SOFWERX,,,2026-11-19,,2026-11-20,,community\r\n";

      } else if (c === "\r") {

  function makeDateFromIso(isoStr) {

  function buildEvents(text) {

    if (!rows.length) {

      out.push({
        id: idx,
        speaker: speaker,
        title: title,
        description: description,
        bio: bio,
        location: location,
        day: d.day,
        dayNum: d.dayNum,
        mon: d.mon,
        monthName: d.monthName,
        monthIndex: d.monthIndex,
        year: d.year,
        yearNum: d.yearNum,
        dateLabel: d.label,
        isRange: isRange,
        endDate: endDateStr,
        startTime: startTime,
        endTime: endTime,
        sortKey: d.sortKey
      });
    });

    out.sort(function (a, b) {
      return a.sortKey - b.sortKey;
    });

    return out;
  }

  function formatTimeLabel(startTime, endTime) {
    if (endTime && endTime !== startTime) {
      return startTime + "\u2013" + endTime;
    }

    return startTime;
  }

  function formatEndDateLabel(ev) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ev.endDate || ""));

    if (!m) {
      return ev.dateLabel;
    }

    var monthIndex = parseInt(m[2], 10) - 1;
    var dayNum = parseInt(m[3], 10);

    return MONTH_FULL[monthIndex] + " " + dayNum + ", " + m[1];
  }

  function frame(inner) {
    ROOT.innerHTML = "";

    var card = el(
      "div",
      "border:1px solid " + BORDER + "; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06);"
    );

    card.appendChild(inner);
    ROOT.appendChild(card);
  }

  function renderMessage(msg) {
    var wrap = el("div");

    var bar = el(
      "div",
      "background:#fff; border-bottom:1px solid " + BORDER + "; padding:10px 16px; font-family:" + HEAD + "; font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:11px; color:" + SLATE + ";",
      { text: "Events" }
    );

    wrap.appendChild(bar);
    wrap.appendChild(el(
      "div",
      "padding:18px 16px; font-size:13px; color:" + GRAY + ";",
      { text: msg }
    ));

    frame(wrap);
  }

  function renderTree() {
    selectedId = null;

    var todayKey = startOfTodayKey();

    var upcoming = events
      .filter(function (ev) {
        return ev.sortKey >= todayKey;
      })
      .sort(function (a, b) {
        return a.sortKey - b.sortKey;
      });

    var past = events
      .filter(function (ev) {
        return ev.sortKey < todayKey;
      })
      .sort(function (a, b) {
        return b.sortKey - a.sortKey;
      });

    var wrap = el("div");

    var header = el(
      "div",
      "background:#fff; border-bottom:1px solid " + BORDER + "; padding:12px 16px;"
    );

    var headerTop = el(
      "div",
      "display:flex; align-items:flex-start; justify-content:space-between; gap:14px;"
    );

    var titleBlock = el("div", "min-width:0;");

    titleBlock.appendChild(el(
      "div",
      "font-family:" + HEAD + "; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:15px; color:" + GREEN + ";",
      { text: "Events Archive" }
    ));

    titleBlock.appendChild(el(
      "div",
      "margin-top:3px; font-size:12.5px; line-height:1.45; color:" + GRAY + ";",
      { text: "Expand a section, then select an event to view its details." }
    ));

    headerTop.appendChild(titleBlock);

    header.appendChild(headerTop);
    wrap.appendChild(header);

    renderUpcomingSection(wrap, upcoming);
    renderPastSection(wrap, past);

    frame(wrap);
  }

  function renderUpcomingSection(parent, upcoming) {
    var section = el("div", "border-bottom:1px solid " + BORDER + ";");

    section.appendChild(el(
      "div",
      "background:" + SOFT_BG + "; border-bottom:1px solid " + BORDER + "; padding:10px 16px; font-family:" + HEAD + "; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:13px; color:" + SLATE + ";",
      { text: "Upcoming" }
    ));

    if (!upcoming.length) {
      section.appendChild(el(
        "div",
        "padding:14px 16px; font-size:13px; color:" + GRAY + ";",
        { text: "No upcoming events are currently listed." }
      ));
    } else {
      upcoming.forEach(function (ev) {
        section.appendChild(makeEventRow(ev, 0));
      });
    }

    parent.appendChild(section);
  }

  function renderPastSection(parent, past) {
    var section = el("div");

    section.appendChild(el(
      "div",
      "background:" + SOFT_BG + "; border-bottom:1px solid " + BORDER + "; padding:10px 16px; font-family:" + HEAD + "; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:13px; color:" + SLATE + ";",
      { text: "Past Events" }
    ));

    if (!past.length) {
      section.appendChild(el(
        "div",
        "padding:14px 16px; font-size:13px; color:" + GRAY + ";",
        { text: "No past events are currently listed." }
      ));

      parent.appendChild(section);
      return;
    }

    var grouped = groupPastEvents(past);
    var years = Object.keys(grouped).sort(function (a, b) {
      return parseInt(b, 10) - parseInt(a, 10);
    });

    years.forEach(function (year) {
      var yearEvents = flattenYear(grouped[year]);
      var yearOpen = !!treeState.years[year];

      var yearBtn = makeTreeButton({
        label: year,
        count: yearEvents.length,
        level: 0,
        isOpen: yearOpen,
        isPrimary: false,
        onClick: function () {
          treeState.years[year] = !treeState.years[year];
          renderTree();
        }
      });

      section.appendChild(yearBtn);

      if (yearOpen) {
        var months = Object.keys(grouped[year]).sort(function (a, b) {
          return parseInt(b, 10) - parseInt(a, 10);
        });

        months.forEach(function (monthIndexText) {
          var monthIndex = parseInt(monthIndexText, 10);
          var monthKey = year + "-" + monthIndex;
          var monthEvents = grouped[year][monthIndexText].slice().sort(function (a, b) {
            return b.sortKey - a.sortKey;
          });

          var monthOpen = !!treeState.months[monthKey];

          var monthBtn = makeTreeButton({
            label: MONTH_FULL[monthIndex],
            count: monthEvents.length,
            level: 1,
            isOpen: monthOpen,
            isPrimary: false,
            onClick: function () {
              treeState.months[monthKey] = !treeState.months[monthKey];
              renderTree();
            }
          });

          section.appendChild(monthBtn);

          if (monthOpen) {
            monthEvents.forEach(function (ev) {
              section.appendChild(makeEventRow(ev, 2));
            });
          }
        });
      }
    });

    parent.appendChild(section);
  }

  function groupPastEvents(past) {
    var grouped = {};

    past.forEach(function (ev) {
      var y = String(ev.yearNum);
      var m = String(ev.monthIndex);

      if (!grouped[y]) {
        grouped[y] = {};
      }

      if (!grouped[y][m]) {
        grouped[y][m] = [];
      }

      grouped[y][m].push(ev);
    });

    return grouped;
  }

  function flattenYear(yearObj) {
    var out = [];

    Object.keys(yearObj).forEach(function (monthKey) {
      yearObj[monthKey].forEach(function (ev) {
        out.push(ev);
      });
    });

    return out;
  }

  function makeTreeButton(cfg) {
    var leftPad = 16 + cfg.level * 22;
    var arrow = cfg.isOpen ? "▾" : "▸";
    var bg = cfg.isPrimary ? "#fff" : "#ffffff";
    var color = cfg.isPrimary ? GREEN : "#1c1c1c";

    var btn = el(
      "button",
      "display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left; cursor:pointer; border:none; border-bottom:1px solid " + ROW_BORDER + "; background:" + bg + "; padding:12px 16px 12px " + leftPad + "px; box-sizing:border-box;",
      {
        attrs: {
          type: "button",
          "aria-expanded": cfg.isOpen ? "true" : "false"
        },
        on: {
          click: cfg.onClick
        }
      }
    );

    var labelWrap = el("span", "display:flex; align-items:center; gap:8px; min-width:0;");

    labelWrap.appendChild(el(
      "span",
      "font-family:" + BODY + "; font-size:13px; color:" + GRAY + "; width:14px; flex:0 0 14px;",
      { text: arrow }
    ));

    labelWrap.appendChild(el(
      "span",
      "font-family:" + HEAD + "; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:" + (cfg.isPrimary ? "14px" : "13px") + "; color:" + color + "; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;",
      { text: cfg.label }
    ));

    btn.appendChild(labelWrap);

    btn.appendChild(el(
      "span",
      "font-size:12px; color:" + GRAY + "; white-space:nowrap;",
      { text: cfg.count + (cfg.count === 1 ? " event" : " events") }
    ));

    hover(btn, HOVER_BG, bg);

    return btn;
  }

  function makeEventRow(ev, level) {
    var leftPad = 16 + level * 22;
    var bg = "#fff";

    var btn = el(
      "button",
      "display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer; border:none; border-bottom:1px solid " + ROW_BORDER + "; background:" + bg + "; padding:12px 16px 12px " + leftPad + "px; box-sizing:border-box;",
      {
        attrs: {
          type: "button"
        },
        on: {
          click: function () {
            selectedId = ev.id;
            renderDetail();
          }
        }
      }
    );

    hover(btn, HOVER_BG, bg);

    var dateCol = el(
      "span",
      "display:flex; flex-direction:column; align-items:center; flex:0 0 46px; line-height:1;"
    );

    dateCol.appendChild(el(
      "span",
      "font-family:" + HEAD + "; font-weight:700; font-size:22px; color:#1c1c1c;",
      { text: ev.day }
    ));

    dateCol.appendChild(el(
      "span",
      "font-family:" + HEAD + "; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:11px; color:" + GRAY + "; margin-top:2px; white-space:nowrap;",
      { text: ev.mon + " '" + ev.year.slice(2) }
    ));

    btn.appendChild(dateCol);

    var txtCol = el(
      "span",
      "flex:1 1 auto; min-width:0;"
    );

    txtCol.appendChild(el(
      "span",
      "display:block; font-family:" + HEAD + "; font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:10px; color:" + TEAL + "; margin-bottom:2px;",
      { text: ev.title ? ev.speaker : "Guest Speaker" }
    ));

    txtCol.appendChild(el(
      "span",
      "display:block; font-family:" + BODY + "; font-weight:600; font-size:13.5px; line-height:1.3; color:#1c1c1c; overflow-wrap:anywhere;",
      { text: ev.title || ev.speaker }
    ));

    btn.appendChild(txtCol);

    return btn;
  }

  function renderDetail() {
    var ev = null;

    for (var i = 0; i < events.length; i++) {
      if (events[i].id === selectedId) {
        ev = events[i];
        break;
      }
    }

    if (!ev) {
      renderTree();
      return;
    }

    var pad = el(
      "div",
      "padding:22px 20px 30px;"
    );

    var back = el(
      "button",
      "display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:0; margin:0 0 16px; cursor:pointer; font-family:" + HEAD + "; font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:13px; color:" + GREEN + ";",
      {
        html: "<span style=\"font-size:16px; line-height:1;\">&larr;</span> Events archive",
        attrs: {
          type: "button"
        },
        on: {
          click: renderTree
        }
      }
    );

    pad.appendChild(back);

    pad.appendChild(el(
      "p",
      "margin:0 0 7px; font-family:" + HEAD + "; font-weight:600; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:" + TEAL + ";",
      { text: ev.title ? ev.speaker : "Guest Speaker" }
    ));

    pad.appendChild(el(
      "h3",
      "margin:0 0 13px; font-family:" + HEAD + "; font-weight:700; font-size:25px; line-height:1.12; color:#1c1c1c; text-wrap:balance;",
      { text: ev.title || ev.speaker }
    ));

    var meta = el(
      "div",
      "display:flex; flex-wrap:wrap; gap:8px 20px; padding:0 0 16px; margin:0 0 20px; border-bottom:2px solid " + GREEN + ";"
    );

    var dateChip = el(
      "span",
      "display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:#444;"
    );

    dateChip.appendChild(el(
      "span",
      "display:inline-block; width:8px; height:8px; border-radius:50%; background:" + GOLD + "; flex:none;"
    ));

    dateChip.appendChild(el(
      "span",
      "",
      { text: ev.isRange ? (ev.dateLabel + " – " + formatEndDateLabel(ev)) : ev.dateLabel }
    ));

    meta.appendChild(dateChip);

    if (ev.startTime) {
      var timeChip = el(
        "span",
        "display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:#444;"
      );

      timeChip.appendChild(el(
        "span",
        "display:inline-block; width:8px; height:8px; border-radius:50%; background:" + GOLD + "; flex:none;"
      ));

      timeChip.appendChild(el(
        "span",
        "",
        { text: formatTimeLabel(ev.startTime, ev.endTime) + " ET" }
      ));

      meta.appendChild(timeChip);
    }

    pad.appendChild(meta);

    ev.description
      .split(/\n\s*\n/)
      .map(function (p) {
        return p.trim();
      })
      .filter(Boolean)
      .forEach(function (p) {
        pad.appendChild(el(
          "p",
          "margin:0 0 15px; font-size:15.5px; line-height:1.65; color:#333;",
          { text: p }
        ));
      });

    if (ev.bio) {
      var bio = el(
        "div",
        "margin-top:22px; background:" + SOFT_BG + "; border-left:4px solid " + GREEN + "; padding:16px 18px;"
      );

      bio.appendChild(el(
        "p",
        "margin:0 0 8px; font-family:" + HEAD + "; font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:12px; color:" + GREEN + ";",
        { text: "About " + ev.speaker }
      ));

      bio.appendChild(el(
        "p",
        "margin:0; font-size:14px; line-height:1.6; color:#444;",
        { text: ev.bio }
      ));

      pad.appendChild(bio);
    }

    frame(pad);
  }

  /* ---------- load ----------
     Events are baked in at build time (see scripts/bake_ai_x_widgets.py) —
     no runtime fetch, so this widget renders standalone anywhere including
     GitHub Pages iframes and OmniCMS pastes. Re-run the bake script after
     every Box CSV sync to refresh EVENTS_CSV below. */
  function load() {
    try {
      events = buildEvents(EVENTS_CSV);
    } catch (e) {
      renderMessage("Events are unavailable right now.");
      return;
    }

    if (!events.length) {
      renderMessage("No events to display.");
      return;
    }

    renderTree();
  }

  load();
})();
/* ]]> */
</script>
